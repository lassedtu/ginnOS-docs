# build the site from docs/ of lassedtu/ginnOS, and the reference with
# Doxygen from its source, and publish both on GitHub Pages. ginnOS sends
# the docs-changed event when its docs or its source change on main.

name: pages

on:
  repository_dispatch:
    types: [docs-changed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: The ginnOS branch or commit to build the pages from
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the ginnOS pages
        uses: actions/checkout@v4
        with:
          repository: lassedtu/ginnOS
          ref: ${{ github.event.client_payload.sha || inputs.ref || 'main' }}
          path: ginnOS
          sparse-checkout: |
            docs
            src
            tools/docs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: mkdocs build

      # Ubuntu has Doxygen 1.9, which is too old for doxygen-awesome-css.
      - name: Install Doxygen
        if: hashFiles('ginnOS/tools/docs/Doxyfile') != ''
        env:
          DOXYGEN_VERSION: 1.18.0
        run: |
          curl -fsSL -o doxygen.tar.gz "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          tar -xzf doxygen.tar.gz
          echo "$PWD/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      # A ginnOS commit from before the reference has no Doxyfile.
      - name: Make the reference
        if: hashFiles('ginnOS/tools/docs/Doxyfile') != ''
        run: |
          doxygen/build.sh
          cp -R build/doxygen/html site/reference

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

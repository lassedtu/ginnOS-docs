# build the site from docs/ of lassedtu/ginnOS and publish it on GitHub
# Pages. ginnOS sends the docs-changed event when its docs change on main.

name: pages

on:
  repository_dispatch:
    types: [docs-changed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the ginnOS pages
        uses: actions/checkout@v4
        with:
          repository: lassedtu/ginnOS
          ref: ${{ github.event.client_payload.sha || 'main' }}
          path: ginnOS
          sparse-checkout: docs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: mkdocs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

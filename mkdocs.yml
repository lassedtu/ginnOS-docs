# the ginnOS docs site. the pages are in the ginnOS repository (docs/);
# this repository has only what the site needs to build and publish.
# ./ginnOS is a checkout of lassedtu/ginnOS: a symbolic link on your
# computer, a second checkout in the workflow.

site_name: ginnOS
site_description: A Unix-like operating system for x86, written from scratch
site_url: https://lassedtu.github.io/ginnOS-docs/
repo_url: https://github.com/lassedtu/ginnOS
repo_name: lassedtu/ginnOS
edit_uri: edit/main/docs/

docs_dir: ginnOS/docs
site_dir: site
strict: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  custom_dir: theme
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

hooks:
  - hooks/cachebust.py

extra_css:
  - stylesheets/ginnos.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: README.md
  - Use ginnOS:
      - use/README.md
      - Get started: use/getting-started.md
      - The desktop: use/desktop.md
      - The apps: use/apps.md
      - The shell: use/shell.md
      - The network: use/networking.md
      - The settings files: use/settings-files.md
  - Write programs:
      - develop/README.md
      - Set up the build tools: develop/setup.md
      - Build ginnOS: develop/building.md
      - The ginnOS toolchain: develop/toolchain.md
      - libc: develop/libc.md
      - The libraries: develop/libraries.md
  - How ginnOS works:
      - internals/README.md
      - The architecture: internals/architecture.md
  - How to write these docs: WRITING.md
